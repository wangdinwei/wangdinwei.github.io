<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw 编程英语单词学习 - 73词进阶版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .container {
            background: white;

            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }

            font-size: 18px;
            margin-bottom: 8px;
        }

            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            background: #4ade80;
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        .progress-text {
            margin-top: 5px;
            font-size: 12px;
            opacity: 0.9;
        }
        
        .jump-container {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .jump-label {
            font-size: 12px;
            color: white;
            opacity: 0.9;
        }
        
        .jump-input {
            width: 50px;
            padding: 4px 8px;
            border: none;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            outline: none;
        }
        
        .jump-input:focus {
            box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
        }
        
        .jump-btn {
            padding: 4px 12px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .jump-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .card-container {
            padding: 20px 15px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .word-card {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .word {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .meaning {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .pronunciation {
            font-size: 15px;
            color: #888;
            background: #f3f4f6;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 12px;
        }
        
        .batch-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            margin-bottom: 10px;
            display: inline-block;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .btn-prev {
            background: #f3f4f6;
            color: #333;
        }
        
        .btn-prev:hover {
            background: #e5e7eb;
        }
        
        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-speak {
            background: #4ade80;
            color: white;
        }
        
        .btn-speak:hover {
            background: #22c55e;
        }
        
        .btn-mastered {
            background: #fbbf24;
            color: white;
        }
        
        .btn-mastered:hover {
            background: #f59e0b;
        }
        
        .spell-container {
            margin-top: 15px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 10px;
            border: 2px dashed #667eea;
        }
        
        .spell-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .spell-input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .spell-input:focus {
            border-color: #667eea;
        }
        
        .spell-input.correct {
            border-color: #4ade80;
            background: #f0fdf4;
        }
        
        .spell-input.incorrect {
            border-color: #ef4444;
            background: #fef2f2;
        }
        
        .spell-feedback {
            font-size: 13px;
            text-align: center;
            margin-top: 6px;
            min-height: 20px;
            font-weight: 600;
        }
        
        .spell-feedback.correct {
            color: #4ade80;
        }
        
        .spell-feedback.incorrect {
            color: #ef4444;
        }
        
        .spell-hint {
            font-size: 10px;
            color: #999;
            text-align: center;
            margin-top: 4px;
        }
        
        .stats {
            background: #f9fafb;
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #e5e7eb;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 10px;
            color: #888;
            margin-top: 3px;
        }
        
        .completed-message {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        .completed-message h2 {
            color: #4ade80;
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .completed-message p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            font-size: 16px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 OpenClaw 编程英语单词</h1>
            <div style="font-size: 12px; margin-bottom: 5px;">73 词进阶版 · 12 个主题批次</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">第 1 / 73 个</div>
            
            <div class="jump-container">
                <span class="jump-label">跳转到：</span>
                <input type="number" class="jump-input" id="jumpInput" min="1" max="73" placeholder="序号">
                <button class="jump-btn" onclick="jumpToWord()">跳转</button>
            </div>
        </div>
        
        <div class="card-container">
            <div class="word-card" id="wordCard">
                <div class="batch-tag" id="batchTag">第 1 批：基础核心词汇</div>
                <div class="word" id="wordText">Prompt</div>
                <div class="meaning" id="meaningText">提示词/提示</div>
                <div class="pronunciation" id="pronunciationText">【普若 - 姆普特】</div>
                
                <div class="controls">
                    <button class="btn btn-prev" id="btnPrev" onclick="prevWord()">⬅️ 上一个</button>
                    <button class="btn btn-speak" id="btnSpeak" onclick="speakWord()">🔊 发音</button>
                    <button class="btn btn-mastered" id="btnMastered" onclick="markMastered()">⭐ 已掌握</button>
                </div>
                
                <div class="spell-container" id="spellContainer">
                    <div class="spell-label">📝 拼写练习：输入这个单词</div>
                    <input type="text" class="spell-input" id="spellInput" placeholder="输入单词..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <div class="spell-feedback" id="spellFeedback"></div>
                    <div class="spell-hint">提示：不区分大小写，输完自动进入下一个 | 按 S 听发音</div>
                </div>
                
                <div class="controls" style="margin-top: 12px;">
                    <button class="btn btn-next" id="btnNext" onclick="nextWord()" disabled style="opacity: 0.5;">下一个 ➡️</button>
                </div>
            </div>
            
            <div class="completed-message hidden" id="completedMessage">
                <h2>🎉 太棒了！</h2>
                <p>你已经学完了全部 73 个单词！</p>
                <p id="masteredCount">已掌握：0 / 73</p>
                <button class="btn btn-restart" onclick="restart()">🔄 重新学习</button>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalStat">73</div>
                <div class="stat-label">总单词数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="masteredStat">0</div>
                <div class="stat-label">已掌握</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="remainingStat">73</div>
                <div class="stat-label">待学习</div>
            </div>
        </div>
    </div>

    <script>
        const words = [

            { word: "Certificate", meaning: "证书", pronunciation: "【色 - 踢 - 非 - 克 - 特】", batch: "第 12 批：安全 & 认证" },
            { word: "Firewall", meaning: "防火墙", pronunciation: "【发 - 呀 - 沃 - 欧】", batch: "第 12 批：安全 & 认证" },
            { word: "CORS", meaning: "跨域资源共享", pronunciation: "【靠 - 斯】（字母读）", batch: "第 12 批：安全 & 认证" },
            { word: "WebSocket", meaning: "WebSocket（全双工通信协议）", pronunciation: "【韦 - 布 - 扫 - 凯 - 特】", batch: "第 12 批：安全 & 认证" }
        ];

        let currentIndex = 0;
        let masteredWords = new Set();

        function updateCard() {
            const currentWord = words[currentIndex];
            
            document.getElementById('batchTag').textContent = currentWord.batch;
            document.getElementById('wordText').textContent = currentWord.word;
            document.getElementById('meaningText').textContent = currentWord.meaning;
            document.getElementById('pronunciationText').textContent = currentWord.pronunciation;
            
            const spellInput = document.getElementById('spellInput');
            spellInput.value = '';
            spellInput.className = 'spell-input';
            spellInput.disabled = false;
            spellInput.focus();
            document.getElementById('spellFeedback').textContent = '';
            document.getElementById('spellFeedback').className = 'spell-feedback';
            document.getElementById('btnNext').disabled = true;
            document.getElementById('btnNext').style.opacity = '0.5';
            
            document.getElementById('progressFill').style.width = `${((currentIndex + 1) / words.length) * 100}%`;
            document.getElementById('progressText').textContent = `第 ${currentIndex + 1} / ${words.length} 个`;
            
            document.getElementById('masteredStat').textContent = masteredWords.size;
            document.getElementById('remainingStat').textContent = words.length - masteredWords.size;
            
            document.getElementById('btnPrev').disabled = currentIndex === 0;
            document.getElementById('btnPrev').style.opacity = currentIndex === 0 ? '0.5' : '1';
            
            document.getElementById('jumpInput').max = words.length;
            
            const card = document.getElementById('wordCard');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'fadeIn 0.5s ease';
        }

        function nextWord() {
            const btnNext = document.getElementById('btnNext');
            if (btnNext.disabled) {
                const spellInput = document.getElementById('spellInput');
                spellInput.focus();
                spellInput.className = 'spell-input incorrect';
                document.getElementById('spellFeedback').textContent = '⚠️ 请先完成拼写练习哦！';
                document.getElementById('spellFeedback').className = 'spell-feedback incorrect';
                return;
            }
            
            if (currentIndex < words.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                showCompleted();
            }
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function speakWord() {
            const word = words[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }

        function markMastered() {
            masteredWords.add(currentIndex);
            updateCard();
            
            const btn = document.getElementById('btnMastered');
            btn.textContent = '✅ 已掌握';
            btn.style.background = '#4ade80';
            setTimeout(() => {
                btn.textContent = '⭐ 已掌握';
                btn.style.background = '#fbbf24';
            }, 1000);
        }
        
        document.getElementById('spellInput').addEventListener('input', function(e) {
            const input = e.target.value.trim();
            const correctWord = words[currentIndex].word;
            const feedback = document.getElementById('spellFeedback');
            const btnNext = document.getElementById('btnNext');
            
            if (input.toLowerCase() === correctWord.toLowerCase()) {
                e.target.className = 'spell-input correct';
                feedback.textContent = '✅ 正确！太棒了！';
                feedback.className = 'spell-feedback correct';
                btnNext.disabled = false;
                btnNext.style.opacity = '1';
                
                setTimeout(() => {
                    if (currentIndex < words.length - 1) {
                        currentIndex++;
                        updateCard();
                    } else {
                        showCompleted();
                    }
                }, 800);
            } else {
                if (correctWord.toLowerCase().startsWith(input.toLowerCase()) && input.length > 0) {
                    e.target.className = 'spell-input';
                    feedback.textContent = '💡 继续...';
                    feedback.className = 'spell-feedback';
                } else if (input.length >= correctWord.length) {
                    e.target.className = 'spell-input incorrect';
                    feedback.textContent = '❌ 不对哦，再试试！';
                    feedback.className = 'spell-feedback incorrect';
                } else {
                    e.target.className = 'spell-input';
                    feedback.textContent = '';
                }
                btnNext.disabled = true;
                btnNext.style.opacity = '0.5';
            }
        });

        function showCompleted() {
            document.getElementById('wordCard').classList.add('hidden');
            document.getElementById('completedMessage').classList.remove('hidden');
            document.getElementById('masteredCount').textContent = `已掌握：${masteredWords.size} / ${words.length}`;
        }

        function restart() {
            currentIndex = 0;
            masteredWords.clear();
            document.getElementById('wordCard').classList.remove('hidden');
            document.getElementById('completedMessage').classList.add('hidden');
            updateCard();
        }
        
        function jumpToWord() {
            const jumpInput = document.getElementById('jumpInput');
            const jumpNum = parseInt(jumpInput.value);
            
            if (isNaN(jumpNum) || jumpNum < 1 || jumpNum > words.length) {
                alert('请输入有效的单词序号（1-73）');
                return;
            }
            
            currentIndex = jumpNum - 1;
            updateCard();
            jumpInput.value = '';
        }

        document.addEventListener('keydown', (e) => {
            if (document.activeElement === document.getElementById('jumpInput')) {
                if (e.key === 'Enter') {
                    jumpToWord();
                }
                return;
            }
            
            if (document.activeElement === document.getElementById('spellInput')) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nextWord();
                }
                return;
            }
            
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextWord();
            } else if (e.key === 'ArrowLeft') {
                prevWord();
            } else if (e.key === 's' || e.key === 'S') {
                speakWord();
            } else if (e.key === 'm' || e.key === 'M') {
                markMastered();
            } else if (e.key === 'p' || e.key === 'P') {
                document.getElementById('spellInput').focus();
            } else if (e.key === 'j' || e.key === 'J') {
                document.getElementById('jumpInput').focus();
            }
        });

        updateCard();
    </script>
</body>
</html>
