<style>
:root{
  --bg:#070809; --card:#0f1622; --card2:#141d2b; --line:#1f2b3d;
  --text:#e9eff8; --text2:#9fb0c8; --text3:#65758b;
  --accent:#3b82f6; --accent2:#5ec8f5; --good:#34d399; --bad:#f87171; --warn:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;line-height:1.6}

.top{padding:13px 18px 9px;border-bottom:1px solid var(--line);
  background:rgba(7,8,9,.96);position:sticky;top:0;z-index:9;backdrop-filter:blur(12px)}
.tr{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
  color:var(--text3);margin-bottom:8px}
.tr b{color:var(--accent2);font-size:14px}
.bar{height:4px;background:#16202e;border-radius:2px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .3s}

main{flex:1;padding:18px 16px 8px;max-width:600px;margin:0 auto;width:100%;
  display:flex;flex-direction:column;justify-content:center}

.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:22px;padding:26px 20px 22px;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:-70%;left:50%;transform:translateX(-50%);
  width:240px;height:240px;background:radial-gradient(circle,rgba(59,130,246,.14),transparent 70%);
  pointer-events:none}

.batch{display:inline-block;font-size:11.5px;color:var(--accent2);background:rgba(59,130,246,.12);
  border:1px solid rgba(59,130,246,.25);padding:3px 11px;border-radius:20px;margin-bottom:16px;
  letter-spacing:.02em}

.word{font-size:38px;font-weight:800;color:#fff;letter-spacing:.5px;line-height:1.2;
  margin-bottom:6px;word-break:break-word}
.ipa{font-size:15px;color:var(--accent2);font-family:"SF Mono",Consolas,monospace;margin-bottom:9px}
.zh{font-size:17px;color:var(--warn);font-weight:700;margin-bottom:18px;letter-spacing:.03em}
.zh::before{content:'读作 ';font-size:13px;color:var(--text3);font-weight:400;letter-spacing:0}

.speak{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,.15);
  border:1px solid rgba(59,130,246,.4);color:#cfe4ff;padding:11px 24px;border-radius:36px;
  font-size:15px;font-weight:600;cursor:pointer;transition:.16s;margin-bottom:18px}
.speak:active{transform:scale(.96)}
.speak:hover{background:rgba(59,130,246,.26)}

.divider{height:1px;background:var(--line);margin:0 0 16px}
.mean{font-size:16px;color:var(--text2);margin-bottom:20px;line-height:1.7}

.spell{width:100%;padding:14px 16px;font-size:20px;text-align:center;letter-spacing:.5px;
  background:#080d14;border:2px solid var(--line);border-radius:13px;color:#fff;outline:none;
  font-family:"SF Mono",Consolas,monospace;transition:.16s}
.spell:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.spell.correct{border-color:var(--good);color:var(--good);background:rgba(52,211,153,.07)}
.spell.incorrect{border-color:var(--bad);color:var(--bad);background:rgba(248,113,113,.07);
  animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.fb{margin-top:11px;font-size:14px;min-height:20px;color:var(--text3)}
.fb.ok{color:var(--good);font-weight:600}
.fb.no{color:var(--bad);font-weight:600}
.fb.go{color:var(--accent2)}

.tip{margin-top:6px;font-size:11.5px;color:var(--text3);line-height:1.7}

.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;
  border:1px solid var(--line);background:transparent;color:var(--text2);cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.32;cursor:not-allowed;background:#25324a;border-color:#25324a}
.btn.primary:hover:not(:disabled){background:#2f6fd8}
.btn.ghost:hover{border-color:#2d4d75;color:#fff}

/* 完成页 */
.done{text-align:center;padding:20px 4px}
.done .big{font-size:40px;font-weight:800;margin-bottom:10px;
  background:linear-gradient(135deg,var(--accent2),var(--good));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.done p{color:var(--text2);font-size:15px;margin:0 0 22px}

footer{padding:12px 18px 20px;text-align:center;font-size:11.5px;color:var(--text3)}
footer span{color:var(--accent2)}
</style>

let idx = 0;
let mastered = new Set();
const mainEl = document.getElementById("main");
const curEl = document.getElementById("cur");
const fillEl = document.getElementById("fill");
const masteredEl = document.getElementById("mastered");

let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); if(!voices.length) setTimeout(loadVoices,300); }
if (typeof speechSynthesis !== "undefined"){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function pickVoice(){
  if(!voices.length) voices = speechSynthesis.getVoices();
  const rules = [v=>/en-US/i.test(v.lang)&&/google|samantha|aria|zira/i.test(v.name),
                 v=>/en-US/i.test(v.lang), v=>/^en/i.test(v.lang)];
  for(const r of rules){ const f = voices.find(r); if(f) return f; }
  return null;
}
function speak(text){
  if (typeof speechSynthesis === "undefined"){ alert("这个浏览器不支持发音，请用 Chrome 或 Safari"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.82;
  const v = pickVoice(); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function updateBar(){
  curEl.textContent = Math.min(idx + 1, WORDS.length);
  fillEl.style.width = (idx / WORDS.length * 100) + "%";
  masteredEl.textContent = "已掌握 " + mastered.size;
}

function render(){
  updateBar();
  if (idx >= WORDS.length) return renderDone();
  const w = WORDS[idx];

  mainEl.innerHTML = `
    <div class="card">
      <div class="batch">${w.batch}</div>
      <div class="word">${w.en}</div>
      <div class="ipa">${w.ipa}</div>
      <div class="zh">${w.zh}</div>
      <div class="speak" id="spk">🔊 听发音</div>
      <div class="divider"></div>
      <div class="mean">${w.mean}</div>
      <input class="spell" id="spell" placeholder="照着拼一遍" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="fb" id="fb"></div>
      <div class="tip">不区分大小写 · 拼对自动进入下一个</div>
      <div class="actions">
        <button class="btn ghost" id="prev">上一个</button>
        <button class="btn primary" id="next" disabled>下一个</button>
      </div>
    </div>`;

  const sp = document.getElementById("spell");
  const fb = document.getElementById("fb");
  const nextBtn = document.getElementById("next");

  setTimeout(()=>{ sp.focus(); speak(w.en); }, 250);
  document.getElementById("spk").onclick = () => speak(w.en);
  document.getElementById("prev").onclick = () => { if(idx>0){ idx--; render(); } };
  nextBtn.onclick = () => { if(!nextBtn.disabled){ idx++; render(); } };

  const target = w.en;

  sp.addEventListener("input", () => {
    const val = sp.value.trim();
    if (val === "") { fb.textContent = ""; fb.className = "fb"; sp.className = "spell"; nextBtn.disabled = true; return; }

    if (val.toLowerCase() === target.toLowerCase()) {
      // 拼对了
      sp.className = "spell correct";
      fb.textContent = "✅ 正确！";
      fb.className = "fb ok";
      nextBtn.disabled = false;
      mastered.add(target);
      masteredEl.textContent = "已掌握 " + mastered.size;
      setTimeout(() => { idx++; render(); }, 780);
    } else if (target.toLowerCase().startsWith(val.toLowerCase())) {
      // 还是前缀，正在输入
      sp.className = "spell";
      fb.textContent = "💡 继续…";
      fb.className = "fb go";
      nextBtn.disabled = true;
    } else if (val.length >= target.length) {
      // 长度够了但拼错
      sp.className = "spell incorrect";
      fb.textContent = "❌ 不对，再试试";
      fb.className = "fb no";
      nextBtn.disabled = true;
    } else {
      sp.className = "spell";
      fb.textContent = "";
      fb.className = "fb";
      nextBtn.disabled = true;
    }
  });

  sp.addEventListener("keydown", e => {
    if (e.key === "Enter" && !nextBtn.disabled) { idx++; render(); }
  });
}

function renderDone(){
  fillEl.style.width = "100%";
  mainEl.innerHTML = `
    <div class="done">
      <div class="big">${WORDS.length} / ${WORDS.length}</div>
      <p>全部过完一遍了，已掌握 ${mastered.size} 个</p>
      <div class="actions">
        <button class="btn ghost" id="again">再来一轮</button>
      </div>
    </div>`;
  document.getElementById("again").onclick = () => { idx = 0; mastered.clear(); render(); };
}

document.addEventListener("keydown", e => {
  if (e.key === "s" || e.key === "S") {
    if (document.activeElement && document.activeElement.id === "spell") return;
    if (idx < WORDS.length) speak(WORDS[idx].en);
  }
});

render();
</script>
