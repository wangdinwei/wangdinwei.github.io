<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070c">
<title>技术单词训练器</title>
<style>
:root{
  --bg:#05070c;
  --panel:#0b1220;
  --panel2:#101a2b;
  --line:#1b2941;
  --ink:#eef4fc;
  --ink2:#93a6c0;
  --ink3:#5b6b84;
  --blue:#4b8cff;
  --cyan:#5fd0f5;
  --amber:#f5b942;
  --amber-soft:#fbd98a;
  --green:#35d39a;
  --red:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  /* 背景光斑 */
  background-image:
    radial-gradient(900px 420px at 50% -8%, rgba(75,140,255,.16), transparent 68%),
    radial-gradient(700px 380px at 88% 108%, rgba(95,208,245,.07), transparent 70%);
}

/* ───────── 顶部进度 ───────── */
.hdr{flex-shrink:0;padding:11px 18px 0}
.hdr-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.counter{font-size:11.5px;color:var(--ink3);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.counter b{color:var(--cyan);font-size:14px;font-weight:700}
.counter .sep{opacity:.4;margin:0 3px}
.right-meta{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:9px}
.right-meta .dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.track{margin-top:8px;height:2px;background:#121c2c;border-radius:2px;overflow:hidden;position:relative}
.track-fill{height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  box-shadow:0 0 10px rgba(95,208,245,.55);transition:width .32s cubic-bezier(.4,0,.2,1)}

/* 跳转条 */
.jump{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10.5px;color:var(--ink3)}
.jump input{width:50px;padding:2px 4px;font-size:11px;text-align:center;color:var(--ink);
  background:#0a1120;border:1px solid var(--line);border-radius:5px;outline:none;
  font-family:"SF Mono",Menlo,Consolas,monospace;-moz-appearance:textfield;transition:.15s}
.jump input::-webkit-outer-spin-button,.jump input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.jump input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(75,140,255,.14)}
.jump input::placeholder{color:#3b475c}
.jump button{padding:2px 9px;font-size:10.5px;font-weight:600;color:#a9c8ff;cursor:pointer;
  background:rgba(75,140,255,.13);border:1px solid rgba(75,140,255,.32);border-radius:5px;transition:.15s}
.jump button:hover{background:rgba(75,140,255,.24)}
.jump button:active{transform:scale(.95)}

/* ───────── 主舞台 ───────── */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 16px}

/* 渐变描边卡片 */
.card{
  position:relative;width:100%;max-width:560px;border-radius:20px;
  padding:1px; /* 描边厚度 */
  background:linear-gradient(158deg,rgba(95,208,245,.42),rgba(75,140,255,.13) 46%,rgba(24,36,58,.55) 100%);
  box-shadow:0 22px 60px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.02) inset;
  animation:cardIn .34s cubic-bezier(.22,.9,.28,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(9px) scale(.988)}to{opacity:1;transform:none}}
.card-inner{
  border-radius:19px;padding:20px 22px 18px;text-align:center;
  background:linear-gradient(180deg,#0c1524,#0a1220 62%,#0b1322);
  position:relative;overflow:hidden;
}
/* 单词背后柔光 */
.card-inner::before{
  content:'';position:absolute;left:50%;top:-58%;transform:translateX(-50%);
  width:360px;height:240px;pointer-events:none;
  background:radial-gradient(ellipse,rgba(75,140,255,.16),transparent 68%);
}

.batch{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;
  color:#8fb6ff;background:rgba(75,140,255,.1);border:1px solid rgba(75,140,255,.22);
  padding:2px 9px;border-radius:20px;letter-spacing:.06em;margin-bottom:11px}
.batch::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--blue)}

.word{
  font-size:clamp(27px,4.6vh,41px);font-weight:800;line-height:1.08;letter-spacing:-.4px;
  color:#fff;word-break:break-word;
  text-shadow:0 0 26px rgba(120,175,255,.28);
}
.ipa{margin-top:5px;font-size:clamp(11px,1.55vh,13.5px);color:var(--cyan);opacity:.9;
  font-family:"SF Mono",Menlo,Consolas,monospace;letter-spacing:.02em}
.zh{margin-top:4px;font-size:clamp(12px,1.7vh,14.5px);color:#e0a93c;font-weight:600}
.zh span{color:var(--ink3);font-weight:400;font-size:11px;margin-right:2px}

/* 发音：圆形按钮 */
.say{margin:11px auto 0;width:44px;height:44px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(circle at 35% 30%,rgba(95,208,245,.28),rgba(75,140,255,.1));
  border:1px solid rgba(95,208,245,.4);transition:.18s}
.say svg{width:19px;height:19px;fill:none;stroke:#d3ebff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.say:hover{background:radial-gradient(circle at 35% 30%,rgba(95,208,245,.42),rgba(75,140,255,.16));
  box-shadow:0 0 20px rgba(95,208,245,.3)}
.say:active{transform:scale(.93)}
.say.playing{animation:pulse .9s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,208,245,.4)}100%{box-shadow:0 0 0 13px rgba(95,208,245,0)}}

/* 意思：答案块 */
.meaning{position:relative;margin:13px auto 0;max-width:100%;display:inline-block;
  padding:8px 16px 8px 14px;border-radius:10px;text-align:left;
  background:linear-gradient(100deg,rgba(245,185,66,.085),rgba(245,185,66,.025));
  border:1px solid rgba(245,185,66,.17)}
.meaning::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;
  border-radius:2px;background:linear-gradient(180deg,rgba(245,185,66,.85),rgba(245,185,66,.1))}
.meaning .lbl{font-size:9.5px;letter-spacing:.16em;color:rgba(245,185,66,.62);
  font-weight:700;display:block;line-height:1.5;margin-bottom:1px}
.meaning .txt{font-size:clamp(14px,1.95vh,16.5px);font-weight:600;color:#fff;line-height:1.4}

/* 拼写输入 */
.field{margin-top:15px;position:relative}
.field input{
  width:100%;padding:11px 14px;text-align:center;
  font-size:clamp(16px,2.3vh,19px);font-weight:600;letter-spacing:.06em;
  color:#fff;background:#070d18;border:1.5px solid #2a3d59;border-radius:11px;
  outline:none;font-family:"SF Mono",Menlo,Consolas,monospace;
  transition:border-color .18s,box-shadow .18s,background .18s;
}
.field input::placeholder{color:#465568;font-weight:400;letter-spacing:.02em;
  font-family:-apple-system,"PingFang SC",sans-serif;font-size:.82em;transition:opacity .12s}
.field input:focus::placeholder{opacity:0}
.field input:focus{border-color:var(--blue);background:#080f1b;
  box-shadow:0 0 0 3px rgba(75,140,255,.1)}
.field input.ok{border-color:var(--green);color:var(--green);background:rgba(53,211,154,.06);
  box-shadow:0 0 0 3px rgba(53,211,154,.13)}
.field input.bad{border-color:var(--red);color:#ff9a9a;background:rgba(255,107,107,.06);
  animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}
  48%{transform:translateX(6px)}72%{transform:translateX(-3px)}}

.fb{margin-top:7px;height:16px;font-size:11.5px;line-height:16px;color:var(--ink3)}
.fb.ok{color:var(--green);font-weight:600}
.fb.no{color:var(--red);font-weight:600}
.fb.go{color:#7fb4ff}

/* 按钮组 */
.nav{display:flex;gap:8px;margin-top:11px}
.btn{flex:1;padding:10px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  border:1px solid #2a3d59;background:transparent;color:#a2b6d0;transition:.15s}
.btn:hover{border-color:#2c4160;color:#cfe0f5}
.btn:active{transform:scale(.975)}
.btn.main{background:linear-gradient(180deg,#3f7ff0,#2f68d4);border-color:#4b8cff;color:#fff;
  box-shadow:0 6px 18px -8px rgba(75,140,255,.85)}
.btn.main:hover:not(:disabled){background:linear-gradient(180deg,#4b8cff,#3a74e0)}
.btn.main:disabled{background:#141d2d;border-color:#25334b;color:#4d5e78;
  box-shadow:none;cursor:not-allowed}

/* 正确时整卡闪光 */
.card.flash .card-inner::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(53,211,154,.17),transparent 62%);
  animation:flashOut .55s ease-out forwards}
@keyframes flashOut{from{opacity:1}to{opacity:0}}

/* 底部 */
.foot{flex-shrink:0;padding:6px 18px 9px;text-align:center;font-size:10.5px;color:#5a6b85;letter-spacing:.03em}
.foot kbd{font-family:inherit;color:#8fa8c8;background:#0d1626;border:1px solid #223350;
  border-radius:4px;padding:0 4px;font-size:9.5px}
.foot .tip-m{display:none}

/* 完成页 */
.done{text-align:center;padding:16px 6px}
.done .big{font-size:34px;font-weight:800;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.done .sub{margin:7px 0 16px;font-size:13px;color:var(--ink2)}

/* ───────── 手机 ───────── */
@media (max-width:600px){
  body{overflow:auto;min-height:100dvh}
  .hdr{padding:12px 16px 0}
  .stage{min-height:calc(100dvh - 132px);padding:12px 14px 6px;
    align-items:center;justify-content:center}
  .foot .tip-kb{display:none}
  .foot .tip-m{display:inline}
  .card-inner{padding:22px 18px 20px;border-radius:17px}
  .word{font-size:clamp(32px,8.6vw,42px)}
  .ipa{font-size:14px;margin-top:8px}
  .zh{font-size:16px;margin-top:7px}
  .say{width:54px;height:54px;margin-top:18px}
  .say svg{width:22px;height:22px}
  .meaning{margin-top:19px;padding:11px 19px 11px 16px}
  .meaning .txt{font-size:16.5px}
  .field{margin-top:20px}
  .field input{padding:14px 16px;font-size:19px}
  .fb{height:21px;font-size:13px;line-height:21px;margin-top:10px}
  .nav{margin-top:15px;gap:11px}
  .btn{padding:13px;font-size:15.5px;border-radius:12px;border-color:#28405f;color:#a8bcd6}
  .foot{padding:10px 16px 14px;font-size:10.5px}
}

/* 极矮屏（笔记本 768 高） */
@media (max-height:790px) and (min-width:601px){
  .card-inner{padding:15px 20px 14px}
  .batch{margin-bottom:8px}
  .say{width:38px;height:38px;margin-top:9px}
  .say svg{width:16px;height:16px}
  .meaning{margin-top:10px;padding:6px 14px 6px 12px}
  .field{margin-top:11px}
  .field input{padding:9px 13px}
  .fb{margin-top:5px;height:14px;line-height:14px}
  .nav{margin-top:8px}
  .btn{padding:8px}
  .foot{padding:4px 18px 6px}
}
@media (max-height:680px) and (min-width:601px){
  .foot{display:none}
  .batch{display:none}
  .card-inner{padding:12px 18px 12px}
  .word{font-size:clamp(24px,4vh,32px)}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-row">
    <span class="counter">第 <b id="cur">1</b><span class="sep">/</span>177</span>
    <span class="right-meta"><span class="dot"></span><span id="mastered">已掌握 0</span></span>
  </div>
  <div class="track"><div class="track-fill" id="fill"></div></div>
  <div class="jump">
    <span>跳到</span>
    <input id="jumpTo" type="number" min="1" max="177" inputmode="numeric" placeholder="序号">
    <span>个</span>
    <button id="jumpBtn">跳转</button>
  </div>
</header>

<main class="stage" id="stage"></main>

<footer class="foot"><span class="tip-kb">拼对自动进入下一个 · 拼错就改 · 按 <kbd>S</kbd> 重听发音</span><span class="tip-m">拼对自动进入下一个 · 拼错就改 · 点喇叭重听</span></footer>

<script>
const WORDS = [
 {
  "en": "SQL",
  "ipa": "/ˌes kjuː ˈel/",
  "zh": "艾斯-秋-艾尔",
  "mean": "查数据库的语言。几乎所有后台系统都用它读写数据。记住四个动作就够日常用：select 查、insert 增、update 改、delete 删。",
  "batch": "第 1 批：编程语言"
 },
 {
  "en": "Bash",
  "ipa": "/bæʃ/",
  "zh": "拜什",
  "mean": "Linux 上的命令行脚本语言。批量改文件、跑定时任务、翻日志都靠它，一串命令存成 .sh 文件就能反复执行。",
  "batch": "第 1 批：编程语言"
 },
 {
  "en": "Python",
  "ipa": "/ˈpaɪθən/",
  "zh": "派森",
  "mean": "编程语言。语法接近英文，上手快。我主要用它写后端、处理数据、调 AI 接口，是这个项目的主力语言。",
  "batch": "第 1 批：编程语言"
 },
 {
  "en": "JavaScript",
  "ipa": "/ˈdʒɑːvəskrɪpt/",
  "zh": "加瓦-斯克瑞普特",
  "mean": "浏览器里的编程语言。网页上点一下就有反应、自动刷新、弹窗，全是它干的。后来也能在服务器上跑（Node.js）。",
  "batch": "第 1 批：编程语言"
 },
 {
  "en": "MySQL",
  "ipa": "/ˌmaɪ es kjuː ˈel/",
  "zh": "买-艾斯-秋-艾尔",
  "mean": "最流行的开源数据库。中小网站用得最多，生态成熟、资料多，缺点是复杂查询能力不如 PostgreSQL。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "Redis",
  "ipa": "/ˈredɪs/",
  "zh": "瑞迪斯",
  "mean": "内存数据库，读写极快。常用来做缓存、计数器、任务队列。数据放内存里，断电可能丢，所以关键数据还要落库。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "index",
  "ipa": "/ˈɪndeks/",
  "zh": "因德克斯",
  "mean": "索引，作用像书的目录。加上索引后按这列查询会快很多，但会占空间、写数据变慢，不是越多越好。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "SQLite",
  "ipa": "/ˌes kjuː laɪt/",
  "zh": "艾斯-秋-莱特",
  "mean": "一个文件就是一个数据库。不用装服务、不用配账号，程序直接读写文件，适合小工具和本地数据。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "schema",
  "ipa": "/ˈskiːmə/",
  "zh": "斯基马",
  "mean": "数据库的结构定义。有哪些表、每张表有哪些字段、什么类型，都写在这里。改 schema 通常要配一份 migration。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "MongoDB",
  "ipa": "/ˈmɑːŋɡoʊ diː biː/",
  "zh": "芒够-迪比",
  "mean": "文档型数据库。存的是 JSON 一样的结构，字段可以不一样，适合结构不固定的数据。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "replica",
  "ipa": "/ˈreplɪkə/",
  "zh": "瑞普利卡",
  "mean": "副本。同样的数据多存一份到另一台机器，主库挂了能顶上，也能分担读请求。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "sharding",
  "ipa": "/ˈʃɑːrdɪŋ/",
  "zh": "沙丁",
  "mean": "分片。数据太大一台机器放不下，就按某个规则拆到多台。复杂度高，小项目一般用不上。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "migration",
  "ipa": "/maɪˈɡreɪʃn/",
  "zh": "迈-格瑞申",
  "mean": "数据库迁移。把老表结构改成新的，同时保住已有数据。生产环境改表必须走迁移，不能手改。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "PostgreSQL",
  "ipa": "/ˈpoʊstɡres kjuː el/",
  "zh": "剖斯特-格瑞斯-秋-艾尔",
  "mean": "开源企业级数据库。功能最全的开源数据库，支持复杂查询、事务、JSON 字段。这个项目的主数据库就是它。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "transaction",
  "ipa": "/trænˈzækʃn/",
  "zh": "传-扎克申",
  "mean": "事务。一组操作要么全成功，要么全失败，中途出错就回滚。转账、扣积分这类不能只做一半的操作必须用它。",
  "batch": "第 2 批：数据库"
 },
 {
  "en": "SSL",
  "ipa": "/ˌes es ˈel/",
  "zh": "艾斯-艾斯-艾尔",
  "mean": "加密证书。网址前面那把锁，让浏览器和服务器之间的数据被加密。现在叫 TLS 更准确，但习惯上还叫 SSL。",
  "batch": "第 3 批：服务器与运维"
 },
 {
  "en": "VPS",
  "ipa": "/ˌviː piː ˈes/",
  "zh": "V-皮-艾斯",
  "mean": "虚拟专用服务器。在云厂商那儿租的一台虚拟机，有独立 IP 和 root 权限，一个月几十块起。",
  "batch": "第 3 批：服务器与运维"
 },
 {
  "en": "SSH",
  "ipa": "/ˌes es ˈeɪtʃ/",
  "zh": "艾斯-艾斯-诶吃",
  "mean": "远程登录服务器的协议。用一条命令连上去操作，所有远程运维都靠它。也常用来做端口转发。",
  "batch": "第 3 批：服务器与运维"
 },
 {
  "en": "cron",
  "ipa": "/krɒn/",
  "zh": "克朗",
  "mean": "定时任务。写一行规则（几点几分跑什么），系统就按点自动执行。写错格式会导致任务静默不跑。",
  "batch": "第 3 批：服务器与运维"
 },
 {
  "en": "Linux",
  "ipa": "/ˈlɪnəks/",
  "zh": "利纳克斯",
  "mean": "服务器操作系统。没有桌面图标，全靠命令行操作。你租的云服务器几乎都是它。",
  "batch": "第 3 批：服务器与运维"
 },
 {
  "en": "nginx",
  "ipa": "/ˈendʒɪn eks/",
  "zh": "恩진-艾克斯",
  "mean": "网站门卫。所有请求先到它，它决定转给谁：静态文件直接给，接口转给后端程序。也负责 HTTPS 加密。",
  "batch": "第 3 批：服务器与运维"
 },
 {
  "en": "Ubuntu",
  "ipa": "/ʊˈbʊntuː/",
  "zh": "乌本图",
  "mean": "最常用的 Linux 发行版。装软件方便、资料多，新手入门首选，服务器和家用都合适。",
  "batch": "第 3 批：服务器与运维"
 },
 {
  "en": "Docker",
  "ipa": "/ˈdɒkər/",
  "zh": "道克尔",
  "mean": "集装箱。把程序和它需要的环境一起打包，到哪台机器上都能一样跑，不用再折腾「我这儿能跑你那儿不行」。",
  "batch": "第 3 批：服务器与运维"
 },
 {

let idx = 0;
const mastered = new Set();

const stageEl   = document.getElementById("stage");
const curEl     = document.getElementById("cur");
const fillEl    = document.getElementById("fill");
const masteredEl= document.getElementById("mastered");
const jumpEl    = document.getElementById("jumpTo");

/* ── 发音 ── */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); if(!voices.length) setTimeout(loadVoices,300); }
if (typeof speechSynthesis !== "undefined"){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  if(!voices.length) voices = speechSynthesis.getVoices();
  const rules = [v=>/en-US/i.test(v.lang)&&/google|samantha|aria|zira/i.test(v.name),
                 v=>/en-US/i.test(v.lang), v=>/^en/i.test(v.lang)];
  for(const r of rules){ const f = voices.find(r); if(f) return f; }
  return null;
}
function say(text){
  if (typeof speechSynthesis === "undefined"){ alert("此浏览器不支持发音，请用 Chrome / Safari"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.82;
  const v = pickVoice(); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function setBar(){
  curEl.textContent = Math.min(idx + 1, WORDS.length);
  fillEl.style.width = (idx / WORDS.length * 100) + "%";
  masteredEl.textContent = "已掌握 " + mastered.size;
}

/* ── 渲染 ── */
function render(){
  setBar();
  if (idx >= WORDS.length) return renderDone();
  const w = WORDS[idx];

  stageEl.innerHTML = `
    <div class="card" id="card">
      <div class="card-inner">
        <span class="batch">${w.batch}</span>
        <div class="word">${w.en}</div>
        <div class="ipa">${w.ipa}</div>
        <div class="zh"><span>读作</span>${w.zh}</div>
        <div class="say" id="say" title="听发音">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </div>
        <div class="meaning">
          <span class="lbl">意思</span>
          <span class="txt">${w.mean}</span>
        </div>
        <div class="field">
          <input id="spell" placeholder="照着拼一遍" autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false">
        </div>
        <div class="fb" id="fb"></div>
        <div class="nav">
          <button class="btn" id="prev">上一个</button>
          <button class="btn main" id="next" disabled>下一个</button>
        </div>
      </div>
    </div>`;

  const card  = document.getElementById("card");
  const sp    = document.getElementById("spell");
  const fb    = document.getElementById("fb");
  const nextB = document.getElementById("next");
  const target = w.en;

  setTimeout(()=>{ sp.focus({preventScroll:true}); say(w.en); }, 220);

  document.getElementById("say").onclick = e => {
    const el = e.currentTarget;
    el.classList.add("playing");
    say(w.en);
    setTimeout(()=>el.classList.remove("playing"), 950);
  };
  document.getElementById("prev").onclick = () => { if (idx > 0){ idx--; render(); } };
  nextB.onclick = () => { if (!nextB.disabled){ idx++; render(); } };

  /* 实时校验（逻辑不变） */
  sp.addEventListener("input", () => {
    const v = sp.value.trim();
    if (v === ""){ sp.className = ""; fb.textContent = ""; fb.className = "fb"; nextB.disabled = true; return; }

    if (v.toLowerCase() === target.toLowerCase()){
      sp.className = "ok";
      fb.textContent = "✓ 正确";
      fb.className = "fb ok";
      nextB.disabled = false;
      mastered.add(target);
      masteredEl.textContent = "已掌握 " + mastered.size;
      card.classList.add("flash");
      setTimeout(()=>{ idx++; render(); }, 760);
    } else if (target.toLowerCase().startsWith(v.toLowerCase())){
      sp.className = "";
      fb.textContent = "继续…";
      fb.className = "fb go";
      nextB.disabled = true;
    } else if (v.length >= target.length){
      sp.className = "bad";
      fb.textContent = "不对，再试试";
      fb.className = "fb no";
      nextB.disabled = true;
    } else {
      sp.className = "";
      fb.textContent = "";
      fb.className = "fb";
      nextB.disabled = true;
    }
  });

  sp.addEventListener("keydown", e => {
    if (e.key === "Enter" && !nextB.disabled){ idx++; render(); }
  });
}

function renderDone(){
  fillEl.style.width = "100%";
  stageEl.innerHTML = `
    <div class="card"><div class="card-inner done">
      <div class="big">${WORDS.length} / ${WORDS.length}</div>
      <div class="sub">全部过完，已掌握 ${mastered.size} 个</div>
      <div class="nav"><button class="btn main" id="again">再来一轮</button></div>
    </div></div>`;
  document.getElementById("again").onclick = () => { idx = 0; mastered.clear(); render(); };
}

/* ── 跳转 ── */
function doJump(){
  let n = parseInt(jumpEl.value, 10);
  if (!n || n < 1){ jumpEl.value = ""; return; }
  idx = Math.min(n, WORDS.length) - 1;
  jumpEl.value = ""; jumpEl.blur(); render();
}
jumpEl.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); doJump(); } });
document.getElementById("jumpBtn").addEventListener("click", doJump);

/* ── 快捷键 S 重听 ── */
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  if (e.key === "s" || e.key === "S"){ if (idx < WORDS.length) say(WORDS[idx].en); }
});

render();
</script>
