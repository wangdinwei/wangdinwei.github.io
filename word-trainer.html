<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术单词训练器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .progress-bar {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            background: #4ade80;
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        .progress-text {
            margin-top: 5px;
            font-size: 12px;
            opacity: 0.9;
        }
        
        .jump-container {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .jump-label {
            font-size: 12px;
            color: white;
            opacity: 0.9;
        }
        
        .jump-input {
            width: 50px;
            padding: 4px 8px;
            border: none;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            outline: none;
        }
        
        .jump-input:focus {
            box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
        }
        
        .jump-btn {
            padding: 4px 12px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .jump-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .card-container {
            padding: 20px 15px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .word-card {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .word {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .meaning {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .pronunciation {
            font-size: 15px;
            color: #888;
            background: #f3f4f6;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 12px;
        }
        
        .batch-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            margin-bottom: 10px;
            display: inline-block;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .btn-prev {
            background: #f3f4f6;
            color: #333;
        }
        
        .btn-prev:hover {
            background: #e5e7eb;
        }
        
        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-speak {
            background: #4ade80;
            color: white;
        }
        
        .btn-speak:hover {
            background: #22c55e;
        }
        
        .btn-mastered {
            background: #fbbf24;
            color: white;
        }
        
        .btn-mastered:hover {
            background: #f59e0b;
        }
        
        .spell-container {
            margin-top: 15px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 10px;
            border: 2px dashed #667eea;
        }
        
        .spell-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .spell-input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .spell-input:focus {
            border-color: #667eea;
        }
        
        .spell-input.correct {
            border-color: #4ade80;
            background: #f0fdf4;
        }
        
        .spell-input.incorrect {
            border-color: #ef4444;
            background: #fef2f2;
        }
        
        .spell-feedback {
            font-size: 13px;
            text-align: center;
            margin-top: 6px;
            min-height: 20px;
            font-weight: 600;
        }
        
        .spell-feedback.correct {
            color: #4ade80;
        }
        
        .spell-feedback.incorrect {
            color: #ef4444;
        }
        
        .spell-hint {
            font-size: 10px;
            color: #999;
            text-align: center;
            margin-top: 4px;
        }
        
        .stats {
            background: #f9fafb;
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #e5e7eb;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 10px;
            color: #888;
            margin-top: 3px;
        }
        
        .completed-message {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        .completed-message h2 {
            color: #4ade80;
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .completed-message p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            font-size: 16px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 技术单词训练器</h1>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">第 1 / 86 个</div>
            
            <div class="jump-container">
                <span class="jump-label">跳转到：</span>
                <input type="number" class="jump-input" id="jumpInput" min="1" max="86" placeholder="序号">
                <button class="jump-btn" onclick="jumpToWord()">跳转</button>
            </div>
        </div>
        
        <div class="card-container">
            <div class="word-card" id="wordCard">
                <div class="batch-tag" id="batchTag">第 1 批：基础核心词汇</div>
                <div class="word" id="wordText">API</div>
                <div class="meaning" id="meaningText">应用程序接口</div>
                <div class="pronunciation" id="pronunciationText">【A-P-I】（字母分开读）</div>
                
                <div class="controls">
                    <button class="btn btn-prev" id="btnPrev" onclick="prevWord()">⬅️ 上一个</button>
                    <button class="btn btn-speak" id="btnSpeak" onclick="speakWord()">🔊 发音</button>
                    <button class="btn btn-mastered" id="btnMastered" onclick="markMastered()">⭐ 已掌握</button>
                </div>
                
                <div class="spell-container" id="spellContainer">
                    <div class="spell-label">📝 拼写练习：输入这个单词</div>
                    <input type="text" class="spell-input" id="spellInput" placeholder="输入单词..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <div class="spell-feedback" id="spellFeedback"></div>
                    <div class="spell-hint">提示：不区分大小写，输完自动进入下一个 | 按 S 听发音</div>
                </div>
                
                <div class="controls" style="margin-top: 12px;">
                    <button class="btn btn-next" id="btnNext" onclick="nextWord()" disabled style="opacity: 0.5;">下一个 ➡️</button>
                </div>
            </div>
            
            <div class="completed-message hidden" id="completedMessage">
                <h2>🎉 太棒了！</h2>
                <p>你已经学完了所有 86 个单词！</p>
                <p id="masteredCount">已掌握：0 / 45</p>
                <button class="btn btn-restart" onclick="restart()">🔄 重新学习</button>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalStat">86</div>
                <div class="stat-label">总单词数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="masteredStat">0</div>
                <div class="stat-label">已掌握</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="remainingStat">86</div>
                <div class="stat-label">待学习</div>
            </div>
        </div>
    </div>

    <script>
        const words = [
            // 第 1 批：编程语言（1-10）
            { word: "Python", meaning: "编程语言，我主要用它写后端", pronunciation: "【派森】", batch: "第 1 批：编程语言" },
            { word: "JavaScript", meaning: "浏览器里的编程语言", pronunciation: "【加瓦-斯克瑞普特】", batch: "第 1 批：编程语言" },
            { word: "Java", meaning: "老牌编程语言，企业系统常用", pronunciation: "【加瓦】", batch: "第 1 批：编程语言" },
            { word: "SQL", meaning: "查数据库的语言", pronunciation: "【艾斯-秋-艾尔】", batch: "第 1 批：编程语言" },
            { word: "Bash", meaning: "Linux 命令行脚本", pronunciation: "【拜什】", batch: "第 1 批：编程语言" },
            { word: "Go", meaning: "Google 出的语言，适合高并发", pronunciation: "【够】", batch: "第 1 批：编程语言" },
            { word: "Rust", meaning: "新语言，主打安全不崩溃", pronunciation: "【拉斯特】", batch: "第 1 批：编程语言" },
            { word: "JSON", meaning: "程序间传数据的格式", pronunciation: "【杰森】", batch: "第 1 批：编程语言" },
            { word: "YAML", meaning: "配置文件常用格式", pronunciation: "【亚-么】", batch: "第 1 批：编程语言" },
            { word: "Markdown", meaning: "写文档的轻量标记语言", pronunciation: "【马克-当】", batch: "第 1 批：编程语言" },

            // 第 2 批：数据库（11-20）
            { word: "PostgreSQL", meaning: "开源企业级数据库", pronunciation: "【剖斯特-格瑞斯-秋-艾尔】", batch: "第 2 批：数据库" },
            { word: "MySQL", meaning: "最流行的开源数据库", pronunciation: "【买-艾斯-秋-艾尔】", batch: "第 2 批：数据库" },
            { word: "SQLite", meaning: "一个文件就是一个数据库", pronunciation: "【艾斯-秋-莱特】", batch: "第 2 批：数据库" },
            { word: "Redis", meaning: "内存数据库，读写极快", pronunciation: "【瑞迪斯】", batch: "第 2 批：数据库" },
            { word: "MongoDB", meaning: "文档型数据库", pronunciation: "【芒够-迪比】", batch: "第 2 批：数据库" },
            { word: "schema", meaning: "数据库的结构定义", pronunciation: "【斯基马】", batch: "第 2 批：数据库" },
            { word: "migration", meaning: "数据库迁移，把老数据搬到新结构", pronunciation: "【迈-格瑞申】", batch: "第 2 批：数据库" },
            { word: "index", meaning: "索引，像书的目录", pronunciation: "【因德克斯】", batch: "第 2 批：数据库" },
            { word: "transaction", meaning: "事务，全成功或全失败", pronunciation: "【传-扎克申】", batch: "第 2 批：数据库" },
            { word: "replica", meaning: "副本，同样的数据存多份", pronunciation: "【瑞普利卡】", batch: "第 2 批：数据库" },

            // 第 3 批：服务器与运维（21-32）
            { word: "Linux", meaning: "服务器操作系统，没有图形界面", pronunciation: "【利纳克斯】", batch: "第 3 批：服务器与运维" },
            { word: "Ubuntu", meaning: "最常用的 Linux 发行版", pronunciation: "【乌本图】", batch: "第 3 批：服务器与运维" },
            { word: "nginx", meaning: "网站门卫，反向代理", pronunciation: "【恩진-艾克斯】", batch: "第 3 批：服务器与运维" },
            { word: "systemd", meaning: "Linux 管家，程序挂了自动重起", pronunciation: "【西斯特姆-迪】", batch: "第 3 批：服务器与运维" },
            { word: "Docker", meaning: "集装箱，程序打包到哪都能跑", pronunciation: "【道克尔】", batch: "第 3 批：服务器与运维" },
            { word: "Kubernetes", meaning: "管一堆容器的调度系统，简称 K8s", pronunciation: "【Q-伯-尼提兹】", batch: "第 3 批：服务器与运维" },
            { word: "SSL", meaning: "加密证书，网址前那把锁", pronunciation: "【艾斯-艾斯-艾尔】", batch: "第 3 批：服务器与运维" },
            { word: "Cloudflare", meaning: "CDN 与安全服务商", pronunciation: "【克劳德-弗莱尔】", batch: "第 3 批：服务器与运维" },
            { word: "VPS", meaning: "虚拟专用服务器", pronunciation: "【V-皮-艾斯】", batch: "第 3 批：服务器与运维" },
            { word: "SSH", meaning: "远程登录服务器的协议", pronunciation: "【艾斯-艾斯-诶吃】", batch: "第 3 批：服务器与运维" },
            { word: "cron", meaning: "定时任务", pronunciation: "【克朗】", batch: "第 3 批：服务器与运维" },
            { word: "daemon", meaning: "守护进程，一直在后台跑", pronunciation: "【迪蒙】", batch: "第 3 批：服务器与运维" },

            // 第 4 批：AI 与模型（33-48）
            { word: "LLM", meaning: "大语言模型", pronunciation: "【艾尔-艾尔-艾姆】", batch: "第 4 批：AI 与模型" },
            { word: "GPT", meaning: "OpenAI 的大模型系列", pronunciation: "【吉-皮-提】", batch: "第 4 批：AI 与模型" },
            { word: "prompt", meaning: "提示词，你让 AI 干什么那段话", pronunciation: "【普朗普特】", batch: "第 4 批：AI 与模型" },
            { word: "token", meaning: "AI 计费单位", pronunciation: "【托肯】", batch: "第 4 批：AI 与模型" },
            { word: "inference", meaning: "推理，模型输出结果的过程", pronunciation: "【因弗伦斯】", batch: "第 4 批：AI 与模型" },

            { word: "RAG", meaning: "先查你的资料再回答，减少瞎编", pronunciation: "【拉格】", batch: "第 4 批：AI 与模型" },

            { word: "VRAM", meaning: "显存，显卡的内存", pronunciation: "【V-然姆】", batch: "第 4 批：AI 与模型" },
            { word: "CUDA", meaning: "NVIDIA 的并行计算平台", pronunciation: "【库达】", batch: "第 4 批：AI 与模型" },
            { word: "FLUX", meaning: "很强的开源画图模型", pronunciation: "【弗拉克斯】", batch: "第 4 批：AI 与模型" },
            { word: "ComfyUI", meaning: "拖方块搭流程的画图工具", pronunciation: "【康菲-U-艾】", batch: "第 4 批：AI 与模型" },
            { word: "Whisper", meaning: "语音识别模型，语音转文字", pronunciation: "【威斯珀】", batch: "第 4 批：AI 与模型" },
            { word: "TTS", meaning: "文字转语音", pronunciation: "【提-提-艾斯】", batch: "第 4 批：AI 与模型" },

            // 第 5 批：框架与接口（49-60）
            { word: "Flask", meaning: "Python 网站框架，轻量灵活", pronunciation: "【弗拉斯克】", batch: "第 5 批：框架与接口" },
            { word: "FastAPI", meaning: "Python 网站框架，比 Flask 新", pronunciation: "【法斯特-诶皮艾】", batch: "第 5 批：框架与接口" },
            { word: "Django", meaning: "Python 重型框架，什么都有现成的", pronunciation: "【詹够】", batch: "第 5 批：框架与接口" },
            { word: "API", meaning: "应用程序接口，说白了是插座", pronunciation: "【诶-皮-艾】", batch: "第 5 批：框架与接口" },
            { word: "SDK", meaning: "别人打包好的工具包", pronunciation: "【艾斯-迪-K】", batch: "第 5 批：框架与接口" },
            { word: "REST", meaning: "一种接口设计风格", pronunciation: "【瑞斯特】", batch: "第 5 批：框架与接口" },
            { word: "GraphQL", meaning: "客户端要什么字段就返回什么", pronunciation: "【格拉夫-秋-艾尔】", batch: "第 5 批：框架与接口" },
            { word: "endpoint", meaning: "接口地址，一个网址对应一个功能", pronunciation: "【恩德-波因特】", batch: "第 5 批：框架与接口" },
            { word: "payload", meaning: "请求里真正传的数据内容", pronunciation: "【佩-罗德】", batch: "第 5 批：框架与接口" },

            { word: "OAuth", meaning: "授权协议，微信登录就是它", pronunciation: "【欧-奥斯】", batch: "第 6 批：安全与支付" },
            { word: "CSRF", meaning: "跨站请求伪造", pronunciation: "【西-艾斯-阿尔-艾弗】", batch: "第 6 批：安全与支付" },
            { word: "XSS", meaning: "跨站脚本攻击", pronunciation: "【艾克斯-艾斯-艾斯】", batch: "第 6 批：安全与支付" },
            { word: "CORS", meaning: "跨域资源共享规则", pronunciation: "【考尔斯】", batch: "第 6 批：安全与支付" },
            { word: "encryption", meaning: "加密，把数据变成看不懂的样子", pronunciation: "【因-克瑞普申】", batch: "第 6 批：安全与支付" },
            { word: "signature", meaning: "签名，验证消息是不是对方真发的", pronunciation: "【西格纳彻】", batch: "第 6 批：安全与支付" },
            { word: "idempotent", meaning: "幂等，重复请求结果一样", pronunciation: "【爱-登泼滕特】", batch: "第 6 批：安全与支付" },
            { word: "callback", meaning: "回调，对方有事主动通知你", pronunciation: "【考尔-拜克】", batch: "第 6 批：安全与支付" },
            { word: "refund", meaning: "退款", pronunciation: "【瑞-凡德】", batch: "第 6 批：安全与支付" },
            { word: "ledger", meaning: "台账，每笔钱都记一笔", pronunciation: "【莱杰】", batch: "第 6 批：安全与支付" },
            { word: "checkout", meaning: "下单结算流程", pronunciation: "【切克-奥特】", batch: "第 6 批：安全与支付" },

            // 第 7 批：性能与工程（73-86）
            { word: "concurrency", meaning: "并发，很多人同时访问", pronunciation: "【肯-克伦西】", batch: "第 7 批：性能与工程" },
            { word: "cache", meaning: "缓存，常用的结果先存起来", pronunciation: "【卡什】", batch: "第 7 批：性能与工程" },
            { word: "queue", meaning: "队列，任务排队一个个处理", pronunciation: "【秋】", batch: "第 7 批：性能与工程" },
            { word: "latency", meaning: "延迟，从请求到回应花多久", pronunciation: "【雷滕西】", batch: "第 7 批：性能与工程" },
            { word: "throughput", meaning: "吞吐量，单位时间处理多少", pronunciation: "【斯鲁-普特】", batch: "第 7 批：性能与工程" },
            { word: "scaling", meaning: "扩容，用户多了加机器", pronunciation: "【斯凯灵】", batch: "第 7 批：性能与工程" },
            { word: "failover", meaning: "故障转移，一台挂了切备用", pronunciation: "【费尔-欧弗】", batch: "第 7 批：性能与工程" },
            { word: "deployment", meaning: "部署，把程序放服务器跑起来", pronunciation: "【迪普洛伊门特】", batch: "第 7 批：性能与工程" },
            { word: "repository", meaning: "仓库，代码存放的地方", pronunciation: "【瑞-帕泽托瑞】", batch: "第 7 批：性能与工程" },
            { word: "commit", meaning: "提交，把改动存一次档", pronunciation: "【科-米特】", batch: "第 7 批：性能与工程" },
            { word: "branch", meaning: "分支，开条平行线改代码", pronunciation: "【布兰奇】", batch: "第 7 批：性能与工程" },
            { word: "debug", meaning: "调试，找出程序为什么不对", pronunciation: "【迪-巴格】", batch: "第 7 批：性能与工程" },
            { word: "refactor", meaning: "重构，功能不变把代码改清爽", pronunciation: "【瑞-法克特】", batch: "第 7 批：性能与工程" },
            { word: "production", meaning: "生产环境，真实用户在用的", pronunciation: "【普-达克申】", batch: "第 7 批：性能与工程" },
        ];

        let currentIndex = 0;
        let masteredWords = new Set();

        function updateCard() {
            const currentWord = words[currentIndex];
            
            // 更新卡片内容
            document.getElementById('batchTag').textContent = currentWord.batch;
            document.getElementById('wordText').textContent = currentWord.word;
            document.getElementById('meaningText').textContent = currentWord.meaning;
            document.getElementById('pronunciationText').textContent = currentWord.pronunciation;
            
            // 重置拼写输入
            const spellInput = document.getElementById('spellInput');
            spellInput.value = '';
            spellInput.className = 'spell-input';
            spellInput.disabled = false;
            spellInput.focus();
            document.getElementById('spellFeedback').textContent = '';
            document.getElementById('spellFeedback').className = 'spell-feedback';
            document.getElementById('btnNext').disabled = true;
            document.getElementById('btnNext').style.opacity = '0.5';
            
            // 更新进度
            document.getElementById('progressFill').style.width = `${((currentIndex + 1) / words.length) * 100}%`;
            document.getElementById('progressText').textContent = `第 ${currentIndex + 1} / ${words.length} 个`;
            
            // 更新统计
            document.getElementById('masteredStat').textContent = masteredWords.size;
            document.getElementById('remainingStat').textContent = words.length - masteredWords.size;
            
            // 按钮状态
            document.getElementById('btnPrev').disabled = currentIndex === 0;
            document.getElementById('btnPrev').style.opacity = currentIndex === 0 ? '0.5' : '1';
            
            // 更新跳转输入框
            document.getElementById('jumpInput').max = words.length;
            
            // 动画效果
            const card = document.getElementById('wordCard');
            card.style.animation = 'none';
            card.offsetHeight; // 触发重绘
            card.style.animation = 'fadeIn 0.5s ease';
        }

        function nextWord() {
            // 检查是否已完成拼写
            const btnNext = document.getElementById('btnNext');
            if (btnNext.disabled) {
                // 还没拼写，提示用户
                const spellInput = document.getElementById('spellInput');
                spellInput.focus();
                spellInput.className = 'spell-input incorrect';
                document.getElementById('spellFeedback').textContent = '⚠️ 请先完成拼写练习哦！';
                document.getElementById('spellFeedback').className = 'spell-feedback incorrect';
                return;
            }
            
            if (currentIndex < words.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                showCompleted();
            }
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function speakWord() {
            const word = words[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }

        function markMastered() {
            masteredWords.add(currentIndex);
            updateCard();
            
            // 视觉反馈
            const btn = document.getElementById('btnMastered');
            btn.textContent = '✅ 已掌握';
            btn.style.background = '#4ade80';
            setTimeout(() => {
                btn.textContent = '⭐ 已掌握';
                btn.style.background = '#fbbf24';
            }, 1000);
        }
        
        // 拼写检查
        document.getElementById('spellInput').addEventListener('input', function(e) {
            const input = e.target.value.trim();
            const correctWord = words[currentIndex].word;
            const feedback = document.getElementById('spellFeedback');
            const btnNext = document.getElementById('btnNext');
            
            if (input.toLowerCase() === correctWord.toLowerCase()) {
                // 拼写正确
                e.target.className = 'spell-input correct';
                feedback.textContent = '✅ 正确！太棒了！';
                feedback.className = 'spell-feedback correct';
                btnNext.disabled = false;
                btnNext.style.opacity = '1';
                
                // 1 秒后自动进入下一个
                setTimeout(() => {
                    if (currentIndex < words.length - 1) {
                        currentIndex++;
                        updateCard();
                    } else {
                        showCompleted();
                    }
                }, 800);
            } else {
                // 检查是否是前缀
                if (correctWord.toLowerCase().startsWith(input.toLowerCase()) && input.length > 0) {
                    e.target.className = 'spell-input';
                    feedback.textContent = '💡 继续...';
                    feedback.className = 'spell-feedback';
                } else if (input.length >= correctWord.length) {
                    e.target.className = 'spell-input incorrect';
                    feedback.textContent = '❌ 不对哦，再试试！';
                    feedback.className = 'spell-feedback incorrect';
                } else {
                    e.target.className = 'spell-input';
                    feedback.textContent = '';
                }
                btnNext.disabled = true;
                btnNext.style.opacity = '0.5';
            }
        });

        function showCompleted() {
            document.getElementById('wordCard').classList.add('hidden');
            document.getElementById('completedMessage').classList.remove('hidden');
            document.getElementById('masteredCount').textContent = `已掌握：${masteredWords.size} / ${words.length}`;
        }

        function restart() {
            currentIndex = 0;
            masteredWords.clear();
            document.getElementById('wordCard').classList.remove('hidden');
            document.getElementById('completedMessage').classList.add('hidden');
            updateCard();
        }
        
        function jumpToWord() {
            const jumpInput = document.getElementById('jumpInput');
            const jumpNum = parseInt(jumpInput.value);
            
            if (isNaN(jumpNum) || jumpNum < 1 || jumpNum > words.length) {
                alert('请输入有效的单词序号（1-86）');
                return;
            }
            
            currentIndex = jumpNum - 1;
            updateCard();
            jumpInput.value = '';
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            // 如果焦点在跳转输入框
            if (document.activeElement === document.getElementById('jumpInput')) {
                if (e.key === 'Enter') {
                    jumpToWord();
                }
                return;
            }
            
            // 如果焦点在拼写输入框，不拦截按键（除了 Enter）
            if (document.activeElement === document.getElementById('spellInput')) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nextWord();
                }
                return;
            }
            
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextWord();
            } else if (e.key === 'ArrowLeft') {
                prevWord();
            } else if (e.key === 's' || e.key === 'S') {
                speakWord();
            } else if (e.key === 'm' || e.key === 'M') {
                markMastered();
            } else if (e.key === 'p' || e.key === 'P') {
                // 快速聚焦到拼写输入框
                document.getElementById('spellInput').focus();
            } else if (e.key === 'j' || e.key === 'J') {
                // 快速聚焦到跳转输入框
                document.getElementById('jumpInput').focus();
            }
        });

        // 初始化
        updateCard();
    </script>
</body>
</html>
