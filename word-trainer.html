<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>技术单词听写训练 · 王丁炜</title>
<style>
:root{
  --bg:#070809;--card:#0e1420;--card2:#131c2b;--line:#1e2a3d;
  --text:#e8eef7;--text2:#9fb0c8;--text3:#64748b;
  --accent:#3b82f6;--accent2:#60d5fa;--good:#34d399;--bad:#f87171;--warn:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;line-height:1.6}

/* 顶部进度 */
.top{padding:14px 20px 10px;border-bottom:1px solid var(--line);background:rgba(7,8,9,.95);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.top-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text3);margin-bottom:9px}
.top-row b{color:var(--accent2);font-size:14px}
.bar{height:5px;background:#16202e;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:3px;transition:width .35s ease}

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 20px;max-width:640px;
  margin:0 auto;width:100%}

/* 题目卡 */
.qcard{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:20px;padding:28px 22px;text-align:center;position:relative;overflow:hidden}
.qcard::before{content:'';position:absolute;top:-60%;left:50%;transform:translateX(-50%);
  width:220px;height:220px;background:radial-gradient(circle,rgba(59,130,246,.16),transparent 70%);pointer-events:none}
.zh{font-size:26px;font-weight:700;color:#fff;line-height:1.35;margin-bottom:6px}
.ipa{font-size:15px;color:var(--accent2);font-family:"SF Mono",Consolas,monospace;margin-bottom:20px}

.speaker{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.4);color:#cfe4ff;
  padding:13px 26px;border-radius:40px;font-size:16px;font-weight:600;cursor:pointer;
  transition:.18s;margin-bottom:22px}
.speaker:active{transform:scale(.96)}
.speaker:hover{background:rgba(59,130,246,.24)}
.speaker .ico{font-size:19px}

/* 输入 */
.answer{width:100%;padding:15px 18px;font-size:22px;text-align:center;letter-spacing:1px;
  background:#0a1018;border:2px solid var(--line);border-radius:14px;color:#fff;
  font-family:"SF Mono",Consolas,monospace;outline:none;transition:.18s}
.answer:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.answer.ok{border-color:var(--good);color:var(--good);background:rgba(52,211,153,.07)}
.answer.bad{border-color:var(--bad);color:var(--bad);background:rgba(248,113,113,.07);
  animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  45%{transform:translateX(7px)}70%{transform:translateX(-4px)}}

.hint{margin-top:13px;font-size:14px;color:var(--text3);min-height:22px}
.hint b{color:var(--warn);font-family:"SF Mono",Consolas,monospace;letter-spacing:2px}
.hint .right{color:var(--good);font-family:"SF Mono",Consolas,monospace;font-size:17px;font-weight:700}

.actions{display:flex;gap:11px;margin-top:18px}
.btn{flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:600;border:1px solid var(--line);
  background:transparent;color:var(--text2);cursor:pointer;transition:.16s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2f6fd8}
.btn.ghost:hover{border-color:#2a4a72;color:#fff}
.btn:disabled{opacity:.36;cursor:not-allowed}

/* 小结 */
.done{text-align:center;padding:10px 0}
.done .big{font-size:42px;font-weight:800;
  background:linear-gradient(135deg,var(--accent2),var(--good));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;margin-bottom:8px}
.done .sub{color:var(--text2);font-size:15px;margin-bottom:22px}
.wrong-list{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:20px;max-height:220px;overflow-y:auto}
.wrong-list h4{margin:0 0 10px;font-size:13px;color:var(--warn);font-weight:600;letter-spacing:.03em}
.wrong-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft,rgba(30,42,61,.5));font-size:14px}
.wrong-item:last-child{border:0}
.wrong-item .w{color:var(--good);font-family:"SF Mono",Consolas,monospace;font-weight:600}
.wrong-item .m{color:var(--text3);font-size:12.5px}

.mode-row{display:flex;gap:8px;margin-bottom:16px}
.mode{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--text3);font-size:13px;cursor:pointer;transition:.15s}
.mode.on{background:rgba(59,130,246,.16);border-color:var(--accent);color:#cfe4ff;font-weight:600}

footer{padding:14px 20px 22px;text-align:center;font-size:12px;color:var(--text3)}
footer span{color:var(--accent2)}
</style>
</head>
<body>

}
function pickVoice(){
  if(!voices.length) voices = speechSynthesis.getVoices();
  const f = [v=>/en-US/i.test(v.lang)&&/google|samantha|zira|aria/i.test(v.name),
             v=>/en-US/i.test(v.lang), v=>/^en/i.test(v.lang)];
  for(const g of f){ const h = voices.find(g); if(h) return h; }
  return null;
}
function speak(text){
  if (typeof speechSynthesis === "undefined"){ alert("这个浏览器不支持发音，请用 Chrome/Safari"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=0.85;
  const v=pickVoice(); if(v) u.voice=v;
  speechSynthesis.speak(u);
}

function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

function start(mode){
  state.mode = mode;
  state.queue = shuffle(DATA);
  state.idx = 0; state.passed = 0; state.streak = 0; state.wrong = []; state.hint = 0;
  totalEl.textContent = DATA.length;
  render();
}

function updateProgress(){
  passedEl.textContent = state.passed;
  totalEl.textContent = DATA.length;
  streakEl.textContent = `连续 ${state.streak}`;
  fillEl.style.width = (state.passed / DATA.length * 100) + "%";
}

function render(){
  updateProgress();
  if (state.idx >= state.queue.length){ return renderDone(); }

  const w = state.queue[state.idx];

  if (state.mode === "learn"){
    mainEl.innerHTML = `
      <div class="qcard">
        <div class="zh">${w.en}</div>
        <div class="ipa">${w.ipa} · 读作 ${w.zh}</div>
        <div style="color:var(--text2);font-size:15px;margin-bottom:20px">${w.mean}</div>
        <div class="speaker" id="spk"><span class="ico">🔊</span> 听一遍</div>
        <div class="actions">
          <button class="btn ghost" id="prev">上一个</button>
          <button class="btn primary" id="next">下一个</button>
        </div>
      </div>`;
    document.getElementById("spk").onclick = () => speak(w.en);
    document.getElementById("next").onclick = () => { state.idx++; state.passed++; render(); };
    document.getElementById("prev").onclick = () => { if(state.idx>0){ state.idx--; state.passed=Math.max(0,state.passed-1); render(); } };
    return;
  }

  // 测试模式：只给中文意思 + 音标，要拼出英文
  mainEl.innerHTML = `
    <div class="qcard">
      <div class="zh">${w.mean}</div>
      <div class="ipa">${w.ipa}</div>
      <div class="speaker" id="spk"><span class="ico">🔊</span> 听发音</div>
      <input class="answer" id="ans" placeholder="输入英文单词" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="hint" id="hint"></div>
      <div class="actions">
        <button class="btn ghost" id="hintBtn">提示</button>
        <button class="btn primary" id="submit">提交</button>
      </div>
    </div>`;

  const ansEl = document.getElementById("ans");
  const hintEl = document.getElementById("hint");
  const btn = document.getElementById("submit");

  setTimeout(()=>{ ansEl.focus(); speak(w.en); }, 260);

  document.getElementById("spk").onclick = () => speak(w.en);
  document.getElementById("hintBtn").onclick = () => {
    state.hint = Math.min(3, state.hint + 1);
    if (state.hint === 1) hintEl.innerHTML = `首字母 <b>${w.en[0]}</b> · 共 ${w.en.replace(/\s/g,'').length} 个字母`;
    else if (state.hint === 2) hintEl.innerHTML = `<b>${w.en.slice(0, Math.ceil(w.en.length/2))}${'_'.repeat(w.en.length-Math.ceil(w.en.length/2))}</b>`;
    else hintEl.innerHTML = `答案：<span class="right">${w.en}</span>`;
  };

  function check(){
    const got = ansEl.value.trim();
    if (!got) return;
    if (got.toLowerCase() === w.en.toLowerCase()){
      ansEl.classList.remove("bad"); ansEl.classList.add("ok");
      state.passed++; state.streak++; state.hint = 0;
      hintEl.innerHTML = `<span class="right">✓ 正确</span>`;
      updateProgress();
      setTimeout(()=>{ state.idx++; render(); }, 620);
    } else {
      ansEl.classList.remove("ok"); ansEl.classList.add("bad");
      state.streak = 0;
      state.hint++;
      if (state.hint === 1) hintEl.innerHTML = `❌ 不对，再试 · 首字母 <b>${w.en[0]}</b>`;
      else if (state.hint === 2) hintEl.innerHTML = `❌ 提示：<b>${w.en.slice(0,Math.ceil(w.en.length/2))}${'_'.repeat(w.en.length-Math.ceil(w.en.length/2))}</b>`;
      else {
        hintEl.innerHTML = `正确答案：<span class="right">${w.en}</span>`;
        if (!state.wrong.find(x=>x.en===w.en)) state.wrong.push({en:w.en, mean:w.mean});
        setTimeout(()=>{ state.idx++; render(); }, 2200);
      }
      updateProgress();
      setTimeout(()=>ansEl.classList.remove("bad"), 400);
    }
  }

  btn.onclick = check;
  ansEl.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
}

function renderDone(){
  const total = DATA.length;
  const wrongCount = state.wrong.length;
  mainEl.innerHTML = `
    <div class="done">
      <div class="big">${state.passed} / ${total}</div>
      <div class="sub">这一轮完成了${wrongCount ? `，错了 ${wrongCount} 个` : "，全对 🎉"}</div>
      ${wrongCount ? `<div class="wrong-list"><h4>要复习的</h4>${state.wrong.map(x=>
        `<div class="wrong-item"><span class="w">${x.en}</span><span class="m">${x.mean}</span></div>`).join("")}</div>` : ""}
      <div class="actions">
        <button class="btn ghost" id="again">再来一轮</button>
        <button class="btn primary" id="learn">先学一遍</button>
      </div>
    </div>`;
  document.getElementById("again").onclick = () => start("test");
  document.getElementById("learn").onclick = () => start("learn");
}

// 启动
mainEl.innerHTML = `
  <div class="qcard" style="text-align:center">
    <div class="zh" style="font-size:22px;margin-bottom:10px">技术单词听写</div>
    <div class="ipa" style="margin-bottom:22px">${DATA.length} 个词 · 听音 → 拼写 → 全对才过</div>
    <div class="mode-row">
      <button class="mode on" id="m1">直接测试</button>
      <button class="mode" id="m2">先学一遍</button>
    </div>
    <div class="actions" style="margin-top:6px">
      <button class="btn primary" id="go">开始</button>
    </div>
    <div style="margin-top:18px;font-size:12.5px;color:var(--text3);line-height:1.9">
      点喇叭听发音 · 输入英文按回车<br>
      错了会一步步给提示，三次后显示答案
    </div>
  </div>`;

let chosen = "test";
document.getElementById("m1").onclick = () => { chosen="test"; document.getElementById("m1").classList.add("on"); document.getElementById("m2").classList.remove("on"); };
document.getElementById("m2").onclick = () => { chosen="learn"; document.getElementById("m2").classList.add("on"); document.getElementById("m1").classList.remove("on"); };
document.getElementById("go").onclick = () => start(chosen);
</script>
</body>
</html>
