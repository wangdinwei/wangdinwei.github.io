const CATS = ["全部", ...Array.from(new Set(DATA.map(x => x.c)))];
let curCat = "全部";
let rate = 0.85;
let curSpeaking = null;

const filtersEl = document.getElementById("filters");
const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
const rateEl = document.getElementById("rate");
const rateValEl = document.getElementById("rateVal");

// 优先选英文语音
let voices = [];
function loadVoices(){
  voices = speechSynthesis.getVoices();
  if(!voices.length){ setTimeout(loadVoices, 300); }
}
loadVoices();
if (typeof speechSynthesis !== "undefined") {
  speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };
}

function pickVoice(){
  if(!voices.length) voices = speechSynthesis.getVoices();
  const pref = [
    v => /en-US/i.test(v.lang) && /google|samantha|zira|aria/i.test(v.name),
    v => /en-US/i.test(v.lang),
    v => /^en/i.test(v.lang),
  ];
  for (const f of pref) {
    const hit = voices.find(f);
    if (hit) return hit;
  }
  return null;
}

function speak(text, cardEl){
  if (typeof speechSynthesis === "undefined") {
    alert("这个浏览器不支持发音，建议用 Chrome 或 Safari 打开");
    return;
  }
  speechSynthesis.cancel();
  if (curSpeaking) curSpeaking.classList.remove("playing");
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = rate;
  const v = pickVoice();
  if (v) u.voice = v;
  if (cardEl){
    cardEl.classList.add("playing");
    curSpeaking = cardEl;
    u.onend = () => cardEl.classList.remove("playing");
    u.onerror = () => cardEl.classList.remove("playing");
  }
  speechSynthesis.speak(u);
}

function render(){
  const kw = searchEl.value.trim().toLowerCase();
  listEl.innerHTML = "";

  let items = DATA;
  if (curCat !== "全部") items = items.filter(x => x.c === curCat);
  if (kw) {
    items = items.filter(x =>
      x.en.toLowerCase().includes(kw) ||
      x.zh.includes(kw) ||
      x.d.includes(kw) ||
      x.ipa.toLowerCase().includes(kw)
    );
  }

  if (!items.length){
    listEl.innerHTML = '<div class="empty">没找到，换个关键词试试</div>';
    return;
  }

  const groups = {};
  items.forEach(x => { (groups[x.c] = groups[x.c] || []).push(x); });

  Object.keys(groups).forEach(cat => {
    const t = document.createElement("div");
    t.className = "group-title";
    t.textContent = cat;
    listEl.appendChild(t);

    const g = document.createElement("div");
    g.className = "grid";

    groups[cat].forEach(x => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="en">${x.en}<span class="spk">🔊</span></div>
        <div class="ipa">${x.ipa}</div>
        <div class="zh">${x.zh}</div>
        <div class="desc">${x.d}</div>
      `;
      card.addEventListener("click", () => speak(x.en, card));
      g.appendChild(card);
    });
    listEl.appendChild(g);
  });
}

function renderFilters(){
  filtersEl.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c === curCat ? " on" : "");
    b.textContent = c;
    b.addEventListener("click", () => { curCat = c; renderFilters(); render(); window.scrollTo({top:0,behavior:"smooth"}); });
    filtersEl.appendChild(b);
  });
}

searchEl.addEventListener("input", render);
rateEl.addEventListener("input", () => {
  rate = parseFloat(rateEl.value);
  rateValEl.textContent = rate.toFixed(2) + "×";
});

renderFilters();
render();
</script>
